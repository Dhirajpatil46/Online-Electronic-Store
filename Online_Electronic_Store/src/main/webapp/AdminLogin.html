<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
    body {
        background: linear-gradient(to right, #6a11cb, #2575fc);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
    }
    .container {
        background-color: white;
        padding: 40px;
        margin: 100px auto;
        width: 400px;
        border-radius: 15px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.25);
        text-align: center;
    }
    h2 {
        color: #333;
        margin-bottom: 30px;
    }
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }
    input[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #4CAF50;
        border: none;
        color: white;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    input[type="submit"]:hover {
        background-color: #45a049;
    }
</style>
</head>
<body>
    <div class="container">
        <h2>Admin Login</h2>
        <form action="alog1" method="post">
            <input type="text" name="aname" placeholder="Username" required><br>
            <input type="password" name="apwd" placeholder="Password" required><br>
            <input type="submit" value="Login"> 
        </form> 
    </div>
</body>
</html>
